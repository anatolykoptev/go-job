name: preflight

# Pre-merge build/test gate. Runs on the self-hosted runner on krolik — NOT a
# paid GitHub-hosted runner (operator rule: only self-hosted; free minutes).
#
# DB round-trip tests in internal/engine/jobs are t.Skip'd when DATABASE_URL is
# unset. This job stands up an ephemeral postgres container for the duration of
# the job, exports DATABASE_URL pointing at it, then runs `make preflight` so
# those tests execute live. The container is torn down when the job exits.
#
# Shared self-hosted box: krolik's prod postgres already holds host
# 127.0.0.1:5432, so the service must NOT publish on a fixed host port (it would
# fail to bind). We publish the container's 5432 to a RANDOM free host port and
# read it back via job.services.postgres.ports['5432']. Collision-proof against
# the prod DB and any other concurrent runner job.

on:
  pull_request:

# One run per ref; cancel in-flight if a new push arrives. Keeps the 4-core
# prod box free between runs.
concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: [self-hosted, krolik]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gojob_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432

    steps:
      - uses: actions/checkout@v4

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/gojob_test?sslmode=disable
        run: |
          # Soft-aware + strict. Migrations whose first line is "-- soft" are
          # extension-gated (002 = Apache AGE, 005 = pgvector); the ephemeral
          # postgres image may lack the extension and the app degrades cleanly
          # (e.g. FTS instead of vector search), so tolerate their failure —
          # mirrors ConnectResumeDB. Any HARD migration failure is a real schema
          # break and MUST fail the gate (no silent error-swallowing).
          set -uo pipefail
          fail=0
          for f in $(ls internal/engine/jobs/schema/*.sql internal/hunt/schema/*.sql | sort); do
            if head -1 "$f" | grep -q "^-- soft"; then
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f" >/dev/null 2>&1 \
                || echo "soft migration skipped (extension absent): $f"
            else
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f" \
                || { echo "::error::hard migration failed: $f"; fail=1; }
            fi
          done
          [ "$fail" -eq 0 ] || { echo "::error::one or more hard migrations failed"; exit 1; }

      - name: make preflight
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/gojob_test?sslmode=disable
        run: make preflight
