name: preflight

# Pre-merge build/test gate. Runs on GitHub-hosted `ubuntu-24.04-arm` — free
# unlimited minutes for public repos, and arm64 matches the ARM prod box this
# service runs on. Moved off the host-a self-hosted runner 2026-07-14: this
# public repo's old workflow had NO fork-PR guard, so any external PR could
# execute code on the prod box; GitHub-hosted runners sandbox every job in a
# throwaway VM, closing that surface outright.
#
# DB round-trip tests in internal/engine/jobs are t.Skip'd when DATABASE_URL is
# unset. This job stands up an ephemeral postgres service container for the
# duration of the job, exports DATABASE_URL pointing at it, then runs
# `make preflight` so those tests execute live.
#
# ATS slug-discovery tests are //go:build integration tagged and don't run
# in preflight. When run manually with -tags=integration, t.Fatalf
# surfaces the failure instead of t.Skip (synthetic-green fix #183).
#
# The service publishes the container's 5432 to a RANDOM free host port, read
# back via job.services.postgres.ports['5432'] — the VM is ours alone now, but
# the pattern is collision-proof by construction.

on:
  pull_request:

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # docs-gate: canonical docs-only detector. Inserted by scripts/docs-gate.rb; the
  # `check` mode compares this block byte for byte, so edit it HERE, never per repo.
  # Spec and failure semantics: ~/.claude/skills/ci-setup/specs/docs-only-fastpath.md
  # A doc is a doc only if no code reads it: a changed `.md`/`docs/` path that a non-doc
  # tracked file names (test, embed, build script) is reclassified as code, and the job log
  # says which file referenced it. Glob/dir reads the scan cannot see: --not-doc / --skip-job.
  docs-scope:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          SERVER: ${{ github.server_url }}
        run: |
          # docs_only=true only on a positive, complete answer; every doubt means full CI.
          is_doc() {
            case "$1" in
              *.md | docs/* | doc/* | LICENSE | LICENSE.* | LICENSE-* | COPYING | NOTICE | AUTHORS) return 0 ;;
              .github/ISSUE_TEMPLATE/* | .github/PULL_REQUEST_TEMPLATE* | .github/CODEOWNERS) return 0 ;;
            esac
            return 1
          }
          why=
          touched() { # every touched path (rename sources included); non-zero on any doubt
            local url page=1 resp n
            case "$EVENT" in
              pull_request) url="$API/repos/$REPO/pulls/$PR/files" ;;
              push)
                [ -n "${BEFORE//0/}" ] || { why="push without a usable before sha"; return 1; }
                url="$API/repos/$REPO/compare/$BEFORE...$AFTER" ;;
              *) why="event $EVENT"; return 1 ;;
            esac
            while :; do
              resp=$(printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" | curl -fsS --retry 2 -K - -H "Accept: application/vnd.github+json" "$url?per_page=100&page=$page") || { why="API error on page $page"; return 1; }
              if [ "$EVENT" = push ] && [ "$page" = 1 ]; then
                [ "$(jq -r .status <<<"$resp")" = ahead ] || { why="push is not a fast-forward"; return 1; }
              fi
              n=$(jq -r '(if type == "array" then . else .files end) | length' <<<"$resp") || { why="unreadable page $page"; return 1; }
              [[ $n =~ ^[0-9]+$ ]] || { why="unreadable page $page"; return 1; }
              jq -r '(if type == "array" then . else .files end) | .[] | .filename, (.previous_filename // empty)' <<<"$resp" || { why="unreadable page $page"; return 1; }
              # compare lists at most 300 files: 300 or more may be a truncated list
              if [ "$EVENT" = push ] && [ "$n" -ge 100 ]; then why="push may exceed the compare file cap"; [ "$page" -lt 3 ] || return 1; fi
              [ "$n" -ge 100 ] || { why=; return 0; }
              page=$((page + 1))
              [ "$page" -le 30 ] || { why="3000 files or more"; return 1; }
            done
          }
          # --- reference-aware pass: a doc that code reads is code ----------------------------
          scratch=
          cleanup() { if [ -n "$scratch" ] && [ -d "$scratch" ]; then rm -rf -- "$scratch"; fi; return 0; }
          trap cleanup EXIT
          # packaging manifests name README/CHANGELOG to ship it, not to read it
          pkg_manifest() {
            case "${1##*/}" in
              Cargo.toml | Cargo.lock | package.json | package-lock.json | pnpm-lock.yaml | pyproject.toml | setup.py | setup.cfg | MANIFEST.in | composer.json | *.gemspec | Dockerfile* | .goreleaser.y*ml | release-please-config.json) return 0 ;;
            esac
            return 1
          }
          community_file() {
            case "$1" in
              README | README.* | CHANGELOG | CHANGELOG.* | CHANGES | CHANGES.* | CONTRIBUTING | CONTRIBUTING.* | CODE_OF_CONDUCT | CODE_OF_CONDUCT.* | SECURITY | SECURITY.* | LICENSE | LICENSE.* | LICENCE | LICENCE.* | COPYING | NOTICE | AUTHORS) return 0 ;;
            esac
            return 1
          }
          ref_tree() { # shallow copy of the tree CI would test (the PR merge ref) in $scratch; non-zero on any doubt
            local rev tw=
            case "$EVENT" in
              pull_request) rev="refs/pull/$PR/merge" ;;
              *) rev="$AFTER" ;;
            esac
            command -v timeout >/dev/null 2>&1 && tw="timeout 120"
            scratch=$(mktemp -d) || { why="no scratch dir"; return 1; }
            git -C "$scratch" init -q || { why="git init failed"; return 1; }
            # the token travels in the environment, never argv (/proc/<pid>/cmdline is world-readable)
            GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$SERVER/.extraheader" \
              GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" \
              $tw git -C "$scratch" fetch -q --depth=1 --no-tags "$SERVER/$REPO.git" "$rev" || { why="tree fetch failed ($rev)"; return 1; }
          }
          # ignore lists name files to leave out, never to read
          ignore_file() {
            case "${1##*/}" in .gitignore | .dockerignore | .npmignore | .prettierignore | .eslintignore | .gitattributes | .gitleaksignore | .markdownlintignore) return 0 ;; esac
            return 1
          }
          # third-party trees carry their own README/LICENSE/CHANGELOG mentions; they never read ours
          vendored() {
            case "$1" in
              vendor/* | */vendor/* | node_modules/* | */node_modules/* | third_party/* | */third_party/*) return 0 ;;
            esac
            return 1
          }
          # Does file $1 carry $2 on a line that is code? A comment line ("// see CLAUDE.md") names
          # a doc without reading it; directives that read ARE live (//go:embed, #[doc = include_str!]).
          # An occurrence inside a URL (https://host/blob/main/README.md) is a link, not a read.
          live_mention() {
            git -C "$scratch" cat-file blob "FETCH_HEAD:$1" 2>/dev/null | LC_ALL=C awk -v n="$2" '
              { s = $0; off = 0
                while ((i = index(s, n)) > 0) {
                  pre = substr($0, 1, off + i - 1); sub(/[A-Za-z0-9_@+.\/:~%-]*$/, "", pre)
                  tok = substr($0, length(pre) + 1, off + i - 1 - length(pre))
                  if (tok !~ /:\/\//) { l = $0; sub(/^[ \t]+/, "", l)
                    # a flag line (`--config docs/x.md`) is code; only `-- ` / `--` alone is an SQL comment
                    if (l ~ /^(\/\/go:|#\[|#!|#include|#embed|#import)/ || l !~ /^(\/\/|#|\* |\*\/|\*$|\/\*|-- |--$|<!--)/) { found = 1; exit } }
                  off += i + length(n) - 1; s = substr(s, i + length(n)) } }
              END { exit !found }'
          }
          # Does a non-doc tracked file read any of the candidate docs? 0 = no, 1 = yes (why says
          # which), 2 = the scan itself failed. Any non-zero means full CI.
          ref_scan() {
            local pats="$scratch/pats" f b hits line src m t bn dir stem p rc=0 start=$SECONDS
            declare -A seen
            : > "$pats"
            for f in "$@"; do
              b=${f##*/}
              # LICENSE, NOTICE, COPYING are English words and nothing reads them: not scanned
              case "$b" in *.*) printf '%s\n%s\n' "$f" "$b" >> "$pats" ;; esac
            done
            [ -s "$pats" ] || return 0
            # (1) literal: the full path or the basename as a whole word. The basename is what
            # filepath.Join(root, "docs", "x.md") and read('DESIGN.md') leave in the source.
            hits=$(git -C "$scratch" grep -I -w -F -o -f "$pats" FETCH_HEAD) || rc=$?
            [ "$rc" -le 1 ] || { why="reference scan failed (git grep rc $rc)"; return 2; }
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              line=${line#FETCH_HEAD:}; src=${line%%:*}; m=${line#*:}
              [ -z "${seen[$src|$m]:-}" ] || continue
              seen[$src|$m]=1
              [ $((SECONDS - start)) -lt 90 ] || { why="reference scan exceeded 90s"; return 2; }
              is_doc "$src" && continue
              vendored "$src" && continue
              ignore_file "$src" && continue
              pkg_manifest "$src" && community_file "${m##*/}" && continue
              live_mention "$src" "$m" || continue
              why="$m treated as code: referenced by $src"
              return 1
            done <<<"$hits"
            # (2) glob: embed/glob patterns with a literal stem (skills/d10-*.md) or a literal
            # directory (skills/*.md). Bare `*.md` / `**/*.md` come from ignore files, linters and
            # --include flags and would make every doc code: ignored, covered by --not-doc.
            rc=0
            hits=$(git -C "$scratch" grep -I -o -E -e '[A-Za-z0-9_@+./*?-]*[*?][A-Za-z0-9_@+./*?-]*[.]mdx?' FETCH_HEAD) || rc=$?
            [ "$rc" -le 1 ] || { why="glob scan failed (git grep rc $rc)"; return 2; }
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              line=${line#FETCH_HEAD:}; src=${line%%:*}; t=${line#*:}
              [ -z "${seen[$src|$t]:-}" ] || continue
              seen[$src|$t]=1
              is_doc "$src" && continue
              vendored "$src" && continue
              bn=${t##*/}; dir=
              case "$t" in */*) dir=${t%/*} ;; esac
              stem=${bn//[*?]/}; stem=${stem%.mdx}; stem=${stem%.md}
              if [ -z "$stem" ]; then
                case "$dir" in "" | *[*?]*) continue ;; esac
              fi
              for p in "$@"; do
                case "$p" in
                  $t | */$t)
                    live_mention "$src" "$t" || break
                    why="$t treated as code: glob in $src matches $p"
                    return 1 ;;
                esac
              done
              [ $((SECONDS - start)) -lt 90 ] || { why="reference scan exceeded 90s"; return 2; }
            done <<<"$hits"
            return 0
          }
          docs_only=false
          cands=()
          # `if !` keeps errexit off for the whole listing: every doubt is an explicit return 1
          if ! list=$(touched); then
            why=${why:-listing failed}
          elif [ -z "$list" ]; then
            why="no changed paths"
          else
            docs_only=true
            while IFS= read -r f; do
              if is_doc "$f"; then cands+=("$f"); else docs_only=false; why="code path: $f"; break; fi
            done <<<"$list"
            if [ "$docs_only" = true ]; then
              rc=0
              if ! ref_tree; then
                docs_only=false; why=${why:-tree fetch failed}
              else
                ref_scan "${cands[@]}" || rc=$?
                [ "$rc" -eq 0 ] || { docs_only=false; why=${why:-reference scan failed}; }
              fi
              [ "$docs_only" != true ] || why="${#cands[@]} doc paths, none read by code"
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only: $docs_only${why:+ ($why)}" | tee -a "$GITHUB_STEP_SUMMARY"

  preflight:
    needs: [docs-scope]
    if: ${{ !cancelled() && !(needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'true') }}
    runs-on: ubuntu-24.04-arm
    # Steady-state is a few minutes; never let a hung run linger for
    # GitHub's 6h default. 20m gives headroom for ./internal/... (14 packages)
    # plus queue time on the free ARM runner pool.
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gojob_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          # Fleet policy: latest patched toolchain (go.mod is the minimum,
          # not the pin) — stdlib CVEs are fixed in patch releases.
          go-version: stable
          # Cache Go modules via setup-go's built-in GitHub cache.
          # Keyed on go.sum hash; hit on second run saves ~30s download.
          cache: true

      - name: Install postgres client
        run: |
          # Unlike the x64 ubuntu images, ubuntu-24.04-arm ships NO postgres
          # client; the migrations step below shells out to host psql.
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi

      - name: Install PDF render toolchain
        run: |
          # internal/pdfrender renders a resume through pandoc -> typst and
          # measures the result. Without these binaries those tests SKIP, and a
          # skipped render test is green over a test that never ran — which is
          # how the theme shipped for five weeks asking for a font the image
          # did not carry, with every gauge and every gate green.
          #
          # CI is set by GitHub, and requireRenderBinaries() turns a missing
          # binary here into a failure instead of a skip. So a broken install
          # step surfaces as a red gate rather than as silent lost coverage.
          #
          # Versions here are pinned; the runtime image's are NOT, and that
          # asymmetry is deliberate but load-bearing, so state it plainly:
          #
          #   here            typst v0.14.2 (tarball) · fonts-ibm-plex 6.1.1-1
          #   Dockerfile      apk add typst  (FROM alpine:latest, unpinned)
          #                   apt-get install fonts-ibm-plex (ubuntu:24.04, unpinned)
          #
          # They agree today — measured, alpine:latest currently carries typst
          # 0.14.2. When alpine bumps it, prod's renderer moves while this gate
          # keeps measuring 0.14.2, and the geometry assertion goes green over a
          # PDF nobody has measured. Pinning the image is tracked in #410.
          # Until then the mitigation is that the assertion is a RATIO against a
          # control run set in the same face, which cancels uniform metric
          # changes (see internal/pdfrender/reference_test.go).
          #
          # typst is not packaged for ubuntu 24.04, hence the release tarball;
          # the runner is ubuntu-24.04-arm, so apt yields the same font build the
          # image's fonts stage takes from ubuntu:24.04.
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc poppler-utils fonts-ibm-plex

          TYPST_VERSION=v0.14.2
          TYPST_SHA256=491b101aa40a3a7ea82a3f8a6232cabb4e6a7e233810082e5ac812d43fdcd47a
          curl -fsSL --retry 3 -o /tmp/typst.tar.xz \
            "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-aarch64-unknown-linux-musl.tar.xz"
          echo "${TYPST_SHA256}  /tmp/typst.tar.xz" | sha256sum -c -
          sudo tar -xJf /tmp/typst.tar.xz --strip-components=1 -C /usr/local/bin \
            typst-aarch64-unknown-linux-musl/typst

          # Assert, do not merely print. A silent font bump on noble-updates
          # would otherwise surface later as a geometry failure blaming the
          # theme, which is the wrong place to look.
          #
          # poppler-utils is deliberately NOT asserted, though pdftotext produces
          # both numbers in that ratio. It measures numerator and denominator
          # with the same code, so a poppler change shifts both and cancels. The
          # font package is different in kind: it can change one glyph's advance
          # relative to another's, and that does not cancel.
          FONTS_VERSION=$(dpkg-query -W -f='${Version}' fonts-ibm-plex)
          echo "fonts-ibm-plex ${FONTS_VERSION}"
          [ "${FONTS_VERSION}" = "6.1.1-1" ] || {
            echo "::error::fonts-ibm-plex is ${FONTS_VERSION}, expected 6.1.1-1 — glyph metrics may have"
            echo "::error::moved. Re-measure internal/pdfrender/reference_test.go's ratio before bumping."
            exit 1
          }
          typst --version
          pandoc --version | head -1

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/gojob_test?sslmode=disable
        run: |
          # Soft-aware + strict. Migrations whose first line is "-- soft" are
          # extension-gated (002 = Apache AGE, 005 = pgvector); the ephemeral
          # postgres image may lack the extension and the app degrades cleanly
          # (e.g. FTS instead of vector search), so tolerate their failure —
          # mirrors ConnectResumeDB. Any HARD migration failure is a real schema
          # break and MUST fail the gate (no silent error-swallowing).
          set -uo pipefail
          hard_files=""
          fail=0
          for f in $(ls internal/engine/jobs/schema/*.sql internal/hunt/schema/*.sql | sort); do
            if head -1 "$f" | grep -q "^-- soft"; then
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f" >/dev/null 2>&1 \
                || echo "soft migration skipped (extension absent): $f"
            else
              hard_files="$hard_files $f"
            fi
          done
          # Batch all hard migrations into a single psql transaction — one
          # process spawn instead of N, ~10s saved on a typical run.
          if [ -n "$hard_files" ]; then
            for f in $hard_files; do
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f" \
                || { echo "::error::hard migration failed: $f"; fail=1; }
            done
          fi
          [ "$fail" -eq 0 ] || { echo "::error::one or more hard migrations failed"; exit 1; }

      - name: make preflight
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/gojob_test?sslmode=disable
          # Serialized: all packages share the single ephemeral gojob_test DB.
          # -p 2 raced package fixtures (DropAccountTables/TRUNCATE) against each
          # other - auth/account tests flaked. -p 1 until per-package DBs exist.
          GO_TEST_PARALLEL: 1
        run: make preflight
