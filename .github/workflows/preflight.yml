name: preflight

# Pre-merge build/test gate. Runs on GitHub-hosted `ubuntu-24.04-arm` — free
# unlimited minutes for public repos, and arm64 matches the ARM prod box this
# service runs on. Moved off the host-a self-hosted runner 2026-07-14: this
# public repo's old workflow had NO fork-PR guard, so any external PR could
# execute code on the prod box; GitHub-hosted runners sandbox every job in a
# throwaway VM, closing that surface outright.
#
# DB round-trip tests in internal/engine/jobs are t.Skip'd when DATABASE_URL is
# unset. This job stands up an ephemeral postgres service container for the
# duration of the job, exports DATABASE_URL pointing at it, then runs
# `make preflight` so those tests execute live.
#
# ATS slug-discovery tests are //go:build integration tagged and don't run
# in preflight. When run manually with -tags=integration, t.Fatalf
# surfaces the failure instead of t.Skip (synthetic-green fix #183).
#
# The service publishes the container's 5432 to a RANDOM free host port, read
# back via job.services.postgres.ports['5432'] — the VM is ours alone now, but
# the pattern is collision-proof by construction.

on:
  pull_request:

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04-arm
    # Steady-state is a few minutes; never let a hung run linger for
    # GitHub's 6h default. 20m gives headroom for ./internal/... (14 packages)
    # plus queue time on the free ARM runner pool.
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gojob_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          # Fleet policy: latest patched toolchain (go.mod is the minimum,
          # not the pin) — stdlib CVEs are fixed in patch releases.
          go-version: stable
          # Cache Go modules via setup-go's built-in GitHub cache.
          # Keyed on go.sum hash; hit on second run saves ~30s download.
          cache: true

      - name: Install postgres client
        run: |
          # Unlike the x64 ubuntu images, ubuntu-24.04-arm ships NO postgres
          # client; the migrations step below shells out to host psql.
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi

      - name: Install PDF render toolchain
        run: |
          # internal/pdfrender renders a resume through pandoc -> typst and
          # measures the result. Without these binaries those tests SKIP, and a
          # skipped render test is green over a test that never ran — which is
          # how the theme shipped for five weeks asking for a font the image
          # did not carry, with every gauge and every gate green.
          #
          # CI is set by GitHub, and requireRenderBinaries() turns a missing
          # binary here into a failure instead of a skip. So a broken install
          # step surfaces as a red gate rather than as silent lost coverage.
          #
          # Versions here are pinned; the runtime image's are NOT, and that
          # asymmetry is deliberate but load-bearing, so state it plainly:
          #
          #   here            typst v0.14.2 (tarball) · fonts-ibm-plex 6.1.1-1
          #   Dockerfile      apk add typst  (FROM alpine:latest, unpinned)
          #                   apt-get install fonts-ibm-plex (ubuntu:24.04, unpinned)
          #
          # They agree today — measured, alpine:latest currently carries typst
          # 0.14.2. When alpine bumps it, prod's renderer moves while this gate
          # keeps measuring 0.14.2, and the geometry assertion goes green over a
          # PDF nobody has measured. Pinning the image is tracked separately.
          # Until then the mitigation is that the assertion is a RATIO against a
          # control run set in the same face, which cancels uniform metric
          # changes (see internal/pdfrender/reference_test.go).
          #
          # typst is not packaged for ubuntu 24.04, hence the release tarball;
          # the runner is ubuntu-24.04-arm, so apt yields the same font build the
          # image's fonts stage takes from ubuntu:24.04.
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc poppler-utils fonts-ibm-plex

          TYPST_VERSION=v0.14.2
          TYPST_SHA256=491b101aa40a3a7ea82a3f8a6232cabb4e6a7e233810082e5ac812d43fdcd47a
          curl -fsSL --retry 3 -o /tmp/typst.tar.xz \
            "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-aarch64-unknown-linux-musl.tar.xz"
          echo "${TYPST_SHA256}  /tmp/typst.tar.xz" | sha256sum -c -
          sudo tar -xJf /tmp/typst.tar.xz --strip-components=1 -C /usr/local/bin \
            typst-aarch64-unknown-linux-musl/typst

          # Assert, do not merely print. A silent font bump on noble-updates
          # would otherwise surface later as a geometry failure blaming the
          # theme, which is the wrong place to look.
          #
          # poppler-utils is deliberately NOT asserted, though pdftotext produces
          # both numbers in that ratio. It measures numerator and denominator
          # with the same code, so a poppler change shifts both and cancels. The
          # font package is different in kind: it can change one glyph's advance
          # relative to another's, and that does not cancel.
          FONTS_VERSION=$(dpkg-query -W -f='${Version}' fonts-ibm-plex)
          echo "fonts-ibm-plex ${FONTS_VERSION}"
          [ "${FONTS_VERSION}" = "6.1.1-1" ] || {
            echo "::error::fonts-ibm-plex is ${FONTS_VERSION}, expected 6.1.1-1 — glyph metrics may have"
            echo "::error::moved. Re-measure internal/pdfrender/reference_test.go's ratio before bumping."
            exit 1
          }
          typst --version
          pandoc --version | head -1

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/gojob_test?sslmode=disable
        run: |
          # Soft-aware + strict. Migrations whose first line is "-- soft" are
          # extension-gated (002 = Apache AGE, 005 = pgvector); the ephemeral
          # postgres image may lack the extension and the app degrades cleanly
          # (e.g. FTS instead of vector search), so tolerate their failure —
          # mirrors ConnectResumeDB. Any HARD migration failure is a real schema
          # break and MUST fail the gate (no silent error-swallowing).
          set -uo pipefail
          hard_files=""
          fail=0
          for f in $(ls internal/engine/jobs/schema/*.sql internal/hunt/schema/*.sql | sort); do
            if head -1 "$f" | grep -q "^-- soft"; then
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f" >/dev/null 2>&1 \
                || echo "soft migration skipped (extension absent): $f"
            else
              hard_files="$hard_files $f"
            fi
          done
          # Batch all hard migrations into a single psql transaction — one
          # process spawn instead of N, ~10s saved on a typical run.
          if [ -n "$hard_files" ]; then
            for f in $hard_files; do
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f" \
                || { echo "::error::hard migration failed: $f"; fail=1; }
            done
          fi
          [ "$fail" -eq 0 ] || { echo "::error::one or more hard migrations failed"; exit 1; }

      - name: make preflight
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/gojob_test?sslmode=disable
          # GitHub-hosted ARM runners have 4 cores; -p 2 is safe here and
          # ~30% faster than -p 1. The Makefile defaults to -p 1 for the
          # 4-core prod box where contention inflates per-test times ~30x.
          GO_TEST_PARALLEL: 2
        run: make preflight
