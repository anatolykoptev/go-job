name: release-please

# Conventional-commit-driven versioning ONLY (tag + GitHub release + changelog).
# This job is lightweight and stays on GitHub-hosted runners (free tier).
#
# Binaries are NOT built here: GoReleaser cross-compile + docker builds are heavy
# and would consume PAID GitHub Actions minutes (operator rule: never use paid
# GHA). The release binaries are built + uploaded LOCALLY on the host-a box by
# ~/bin/goreleaser-release-local.sh (a systemd timer that detects a new
# release-please tag whose GitHub release has no binary assets and runs
# `goreleaser release` on the box). Do NOT add a goreleaser job back here.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Run release-please as the krolik-release-bot GitHub App, NOT GITHUB_TOKEN.
      # A release PR opened with GITHUB_TOKEN does NOT trigger workflows (the
      # recursion guard) — preflight never runs, the PR sits `action_required`,
      # and the required check blocks merge (this is what stalled #288). An
      # App-opened PR DOES get CI runs. App ID/key wired via repo var+secret.
      - uses: actions/create-github-app-token@v2
        id: bot-token
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ steps.bot-token.outputs.token }}
          target-branch: main
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
