# Prometheus alert rules for go-job — covers all 9 enforce:true failure classes
# from the bug-hunt-council audit.
#
# Tuning philosophy:
#   - `for: 0m` is banned — every alert needs a sustained window to avoid
#     firing on transient blips (Redis hiccup, LLM timeout, single parse error).
#   - Hunt worker cycle = 6h, opportunity worker = 12h. Alert windows must be
#     calibrated to cycle cadence, not 5m blips.
#   - `increase(...[short]) > 0` is banned — require multiple events, not one.
#   - Severity: warning = investigate when convenient; critical = act now.
#   - Alerts that fire on persistent config issues (no_key, notifier_disabled)
#     use longer `for:` to fire once, not every 5m.
#
# Deployed to ~/deploy/server-config/config/prometheus/alerts-go-job.yml.
# Alertmanager routes to dozor (Telegram) based on `receiver: dozor` label.
groups:
  - name: go-job-sources
    interval: 5m
    rules:
      # parse_fail = a connector's parser rejected the upstream response —
      # almost always upstream schema drift (e.g. habr changed employment field
      # struct→string). Sustained parse_fail means the source is dead until the
      # parser is made tolerant.
      # Tuning: require 5+ parse_fails in 1h sustained 10m — a single transient
      # parse error (truncated response, partial fetch) is normal and self-heals.
      - alert: GojobSourceParseFail
        expr: increase(gojob_platform_results_total{outcome="parse_fail"}[1h]) > 5
        for: 10m
        labels:
          severity: warning
          service: go-job
          receiver: dozor
          failure_class: silent_downgrade
        annotations:
          summary: "go-job: source {{ $labels.platform }} parse_fail (upstream schema drift)"
          description: |
            Connector {{ $labels.platform }} returned parse_fail 5+ times in the
            last hour, sustained for 10m. Its parser could not decode the upstream
            response, typically because the source site changed its JSON/HTML
            schema. The source yields ZERO jobs until the parser is fixed.

            Triage:
              docker logs go-job --since 1h | grep -E "{{ $labels.platform }}.*(parse|unmarshal)"
            Fix class: tolerant decode + ErrParse wrap (see P4 source-fix arc).

      # no_key = source needs an API key that is not configured. Clean skip, not
      # a crash — but the source is permanently dark until the key is wired.
      # Tuning: for: 30m — this is a persistent config issue that won't self-heal.
      # Fire once after 30m, not every 5m while the counter climbs.
      - alert: GojobSourceNoKey
        expr: increase(gojob_platform_results_total{outcome="no_key"}[1h]) > 0
        for: 30m
        labels:
          severity: warning
          service: go-job
          receiver: dozor
          failure_class: config_drift
        annotations:
          summary: "go-job: source {{ $labels.platform }} skipped — no API key configured"
          description: |
            Connector {{ $labels.platform }} requires an API key that is unset in
            the go-job container env. The source has been skipped (no_key) for
            30m+. It contributes zero jobs until the key is wired.

            Fix: wire the key into compose/apps.yml go-job environment, redeploy.

      # Delegation health: when ATS discovery falls back to the local single-source
      # SearchDirect path, go-search (the multi-source delegation backend) is
      # unreachable or empty. go-job is then back on the degraded DDG-only floor.
      # Tuning: require 3+ fallbacks in 1h sustained 10m — a single go-search
      # restart or transient network blip is normal and self-heals.
      - alert: GojobDelegationFallback
        expr: increase(gojob_hunt_discovery_source_total{source="local-fallback"}[1h]) > 3
        for: 10m
        labels:
          severity: warning
          service: go-job
          receiver: dozor
          failure_class: dependency_block
        annotations:
          summary: "go-job: ATS discovery on LOCAL FALLBACK — go-search delegation unreachable"
          description: |
            ATS board-URL discovery fell back to the local SearchDirect path 3+
            times in the last hour, sustained for 10m. The go-search delegation
            backend is unreachable or returning empty. go-job is on the degraded
            single-source floor — greenhouse/lever/ashby discovery is crippled.

            Triage:
              curl -s --max-time 6 http://go-search:8890/health
              docker logs go-job --since 1h | grep -E "GO_SEARCH_URL|discovery.*fallback"

  # ESC-2 failure-class alerts: scoring pipeline health gauges added to make
  # silent scoring degradation and unscored-job freeze visible before the
  # hunt_jobs table goes stale. These gauges are set by the hunt worker's
  # end-of-cycle unscored sweep and the scoring degradation flag.

  - name: go-job-failure-classes
    interval: 5m
    rules:
      # freeze_stall = the oldest unscored open job has been waiting > 2h.
      # Tuning: for: 10m — the gauge is set once per hunt cycle (6h), so 10m
      # sustained avoids flapping on a single stale sweep reading.
      - alert: GojobHuntScoringFreezeStall
        expr: gojob_hunt_unscored_jobs_max_age_seconds > 7200
        for: 10m
        labels:
          severity: warning
          service: go-job
          receiver: dozor
          failure_class: freeze_stall
        annotations:
          summary: "go-job: unscored jobs oldest age > 2h — scoring pipeline stalled"
          description: |
            The oldest unscored open job has been waiting for more than 2 hours
            (gojob_hunt_unscored_jobs_max_age_seconds > 7200) for 10m+. The
            scoring pipeline is stuck: either the LLM backend is down, the
            per-cycle circuit breaker is permanently tripping (budget too low),
            or the unscored sweep is not running.

            Triage:
              docker logs go-job --since 2h | grep -E "breaker|sweep|llm_error|parse_fail"
              Check LLM_API_BASE health and HUNT_SCORE_MAX_LLM_PER_CYCLE budget.

      # silent_downgrade = the scoring degradation flag has been set for 30m.
      # Tuning: for: 30m (bumped from 10m) — the flag resets each cycle, so a
      # single degraded cycle is normal (LLM budget exhausted near cycle end).
      # 30m sustained means the pipeline is not recovering between cycles.
      - alert: GojobHuntScoringDegraded
        expr: gojob_hunt_scoring_degraded == 1
        for: 30m
        labels:
          severity: warning
          service: go-job
          receiver: dozor
          failure_class: silent_downgrade
        annotations:
          summary: "go-job: scoring degraded — circuit breaker open or fail-open path active"
          description: |
            The hunt scoring pipeline has been in degraded mode for 30m+
            (gojob_hunt_scoring_degraded == 1). Either the per-cycle LLM circuit
            breaker is open (budget exhausted) or the fail-open path was taken
            (llm_error or parse_fail in scoreJobIfCreated). Jobs are ingested
            but land as unscored — fit-score notifications degrade to unscored
            cards and the fit gate is bypassed.

            Triage:
              docker logs go-job --since 30m | grep -E "breaker|llm_error|parse_fail|degraded"
              Check LLM_API_BASE health and HUNT_SCORE_MAX_LLM_PER_CYCLE budget.

      # wiring_dark = score persist failures after all retries exhausted.
      # Tuning: require 3+ failures in 30m sustained 10m — a single DB hiccup
      # is normal (connection blip, lock contention). Sustained failures mean
      # the DB is actually unhealthy.
      - alert: GojobScorePersistFailures
        expr: increase(gojob_hunt_score_persist_failures_total[30m]) > 3
        for: 10m
        labels:
          severity: warning
          service: go-job
          receiver: dozor
          failure_class: wiring_dark
        annotations:
          summary: "go-job: score persist failures — DB health issue"
          description: |
            SetJobScore failed after all retry attempts 3+ times in 30m,
            sustained for 10m. Jobs are ingested but their fit-scores are not
            persisted to the DB, degrading fit filtering and notification quality.

            Triage:
              docker logs go-job --since 30m | grep -E "SetJobScore|persist.*fail"
              Check postgres health: docker exec postgres pg_isready

      # auth_expiry = Telegram bot token invalid or unreachable.
      # Tuning: for: 15m (bumped from 5m) — Telegram API can have transient
      # blips. 15m sustained means the token is actually revoked or the API
      # is genuinely unreachable.
      - alert: GojobNotifyHealthDown
        expr: gojob_hunt_notify_health == 0
        for: 15m
        labels:
          severity: warning
          service: go-job
          receiver: dozor
          failure_class: auth_expiry
        annotations:
          summary: "go-job: Telegram notify health down — bot token invalid or unreachable"
          description: |
            The Telegram bot health check has been failing for 15m+
            (gojob_hunt_notify_health == 0). The bot token may be revoked,
            the Telegram API may be unreachable, or the bot container is down.
            New job notifications are silently dropped.

            Triage:
              docker logs go-job --since 30m | grep -E "telegram|notify.*health"
              Check TELEGRAM_BOT_TOKEN validity.

      # epoch_apply_gap = circuit breaker trips per cycle. The LLM budget is
      # exhausted before all jobs are scored.
      # Tuning: > 5 trips in 1h sustained 10m (bumped from > 3) — a few trips
      # per cycle is normal when job volume is high. 5+ sustained means the
      # budget is consistently too low.
      - alert: GojobScoreBreakerTrips
        expr: increase(gojob_hunt_score_breaker_trips_total[1h]) > 5
        for: 10m
        labels:
          severity: warning
          service: go-job
          receiver: dozor
          failure_class: epoch_apply_gap
        annotations:
          summary: "go-job: LLM circuit breaker tripping frequently — budget too low"
          description: |
            The LLM scoring circuit breaker tripped more than 5 times in the
            last hour, sustained for 10m. The per-cycle LLM budget
            (HUNT_SCORE_MAX_LLM_PER_CYCLE) is too low for the current job
            volume, leaving jobs unscored at the end of each cycle.

            Triage:
              docker logs go-job --since 1h | grep -E "breaker|budget"
              Increase HUNT_SCORE_MAX_LLM_PER_CYCLE if LLM backend is healthy.

      # resource_exhaustion = goroutine leak detection (OBS-1).
      # Tuning: rate over 10m window (not 5m), threshold 20 (not 10) — normal
      # hunt cycle goroutine churn (ATS fan-out, enrichment, scoring) can
      # easily hit 10/min rate briefly. 20/min sustained 10m is a real leak.
      - alert: GojobGoroutineLeak
        expr: rate(gojob_runtime_goroutines[10m]) > 20
        for: 10m
        labels:
          severity: warning
          service: go-job
          receiver: dozor
          failure_class: resource_exhaustion
        annotations:
          summary: "go-job: goroutine count growing rapidly — possible leak"
          description: |
            The goroutine count is growing at more than 20 per 10m sustained
            for 10m (rate(gojob_runtime_goroutines[10m]) > 20). This indicates
            a goroutine leak — known vectors: ATS fan-out, slug cache L2
            writes, detached enrichment, person research.

            Triage:
              curl -s http://localhost:9891/metrics | grep gojob_runtime_goroutines
              docker logs go-job --since 30m | grep -E "goroutine|leak"

      # resource_exhaustion = goroutine count critically high (OBS-1).
      # Tuning: for: 10m (bumped from 5m) — avoid flapping on a brief spike.
      - alert: GojobGoroutineCountHigh
        expr: gojob_runtime_goroutines > 10000
        for: 10m
        labels:
          severity: critical
          service: go-job
          receiver: dozor
          failure_class: resource_exhaustion
        annotations:
          summary: "go-job: goroutine count > 10000 — OOM risk"
          description: |
            The goroutine count has exceeded 10000 for 10m+
            (gojob_runtime_goroutines > 10000). This is a critical resource
            exhaustion risk — the process may OOM. Restart go-job immediately
            and investigate the leak source.

            Triage:
              Restart: docker compose restart go-job
              Profile: kill -USR1 <pid> (if pprof enabled)

      # resource_exhaustion = slug cache L2 write failures (OBS-3).
      # Tuning: require 5+ failures in 10m sustained 10m — a single Redis
      # hiccup (connection blip, brief restart) is normal. Sustained failures
      # mean Redis is actually down.
      - alert: GojobSlugCacheL2WriteErrors
        expr: increase(gojob_slug_cache_l2_write_errors_total[10m]) > 5
        for: 10m
        labels:
          severity: warning
          service: go-job
          receiver: dozor
          failure_class: resource_exhaustion
        annotations:
          summary: "go-job: slug cache L2 write failures — Redis down or unreachable"
          description: |
            Slug cache L2 writes (Redis SET) are failing 5+ times per 10m,
            sustained for 10m. Redis may be down or unreachable. The cache
            operates in-memory-only until Redis recovers — a restart will lose
            evicted slugs (404 slugs may be re-introduced).

            Triage:
              docker exec redis redis-cli ping
              docker logs go-job --since 30m | grep -E "slugcache.*L2"

      # loopback_misroute = notifier disabled in opportunity ingest (OBS-2).
      # Tuning: for: 15m — the opportunity worker runs every 12h, so this
      # counter only fires when there are items to notify AND notifier is nil.
      # 15m sustained ensures it's a real config issue, not a transient nil
      # during init.
      - alert: GojobNotifierDisabled
        expr: increase(gojob_hunt_notify_total{outcome="notifier_disabled"}[1h]) > 0
        for: 15m
        labels:
          severity: warning
          service: go-job
          receiver: dozor
          failure_class: loopback_misroute
        annotations:
          summary: "go-job: notifier disabled — notifications silently dropped"
          description: |
            The notifier is nil (bot init failed or TELEGRAM_BOT_TOKEN /
            HUNT_NOTIFY_CHAT_ID not configured). Bounty, security, and
            freelance notifications are being silently dropped for 15m+.

            Triage:
              docker logs go-job --since 30m | grep -E "notifier|telegram.*init"
              Check TELEGRAM_BOT_TOKEN and HUNT_NOTIFY_CHAT_ID in container env.
