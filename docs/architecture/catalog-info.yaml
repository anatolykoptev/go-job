apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: go-job
  title: go-job — jobs / freelance / bounty aggregator
  description: |
    Job search, application tracker, LinkedIn integration and Algora bounty pipeline,
    MCP-native. Collects from 17 source connectors into a persistent Postgres hunt
    store, then ranks and prepares applications over that accumulated record.
    Collection uses public APIs, SearXNG and a proxy pool — plumbing, not the product's
    edge; see docs/architecture/principles.md.
  annotations:
    github.com/project-slug: anatolykoptev/go-job
    likec4.dev/diagrams: /c4/go-job/
    krolik.run/dozor: go-job
    krolik.run/port: "8891"
  links:
    - url: https://m.krolik.run/c4/go-job/
      title: Architecture diagrams
    - url: https://github.com/anatolykoptev/go-job
  tags:
    - go
    - jobs
    - mcp
    - linkedin
    - bounty
    - resume
spec:
  type: service
  lifecycle: production
  owner: platform
  system: search
  tier: 2
  providesApis:
    - go-job-mcp
  consumesApis:
    - go-search-mcp
    - memdb-rest-api
